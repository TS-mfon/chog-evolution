name: Evolution worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: chog-evolution-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process-one-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@chog/worker
      - name: Check worker configuration
        run: |
          node -e 'for (const key of ["MONGODB_URI", "GENLAYER_NETWORK", "GENLAYER_RPC_URL", "GENLAYER_CONTRACT_ADDRESS", "GENLAYER_PRIVATE_KEY"]) { if (!process.env[key]) { console.error(`Missing required GitHub Actions secret/variable: ${key}`); process.exitCode = 1; } }'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: chog_evolution
          GENLAYER_NETWORK: studionet
          GENLAYER_RPC_URL: https://studio.genlayer.com/api
          GENLAYER_CONTRACT_ADDRESS: "0x73Bd1106FFa722cf8e71A04f612ee868CDCd2396"
          GENLAYER_PRIVATE_KEY: ${{ secrets.GENLAYER_PRIVATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
      - run: npm run once --workspace=@chog/worker
        env:
          NODE_ENV: production
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: chog_evolution
          GENLAYER_NETWORK: studionet
          GENLAYER_RPC_URL: https://studio.genlayer.com/api
          GENLAYER_CONTRACT_ADDRESS: "0x73Bd1106FFa722cf8e71A04f612ee868CDCd2396"
          GENLAYER_PRIVATE_KEY: ${{ secrets.GENLAYER_PRIVATE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
          WORKER_POLL_INTERVAL_MS: "1000"
          WORKER_LEASE_MS: "180000"
          WORKER_BATCH_SIZE: "10"
          APP_ORIGIN: https://chog-evolution.vercel.app
          PUBLIC_API_PATH: /api
          WEB_ORIGIN: https://chog-evolution.vercel.app
          MONAD_TESTNET_CHAIN_ID: "10143"
          MONAD_TESTNET_RPC_URL: https://testnet-rpc.monad.xyz
          DEMO_COLLECTION_ADDRESS: "0x45119A32ca6C4d67424401dA92Abe4EC6c83f8Ce"
          MONAD_MAINNET_CHAIN_ID: "143"
          MONAD_MAINNET_RPC_URL: https://rpc.monad.xyz
          ORIGINAL_CHOG_COLLECTION_ADDRESS: "0xc96d31F8626c6D03Fae5dCD3d61e3FB9F4a73763"
          X_SOURCE_MODE: ${{ vars.X_SOURCE_MODE || 'public_page' }}
          X_API_BEARER_TOKEN: ${{ secrets.X_API_BEARER_TOKEN }}
          GITHUB_PUBLIC_READ_TOKEN: ${{ secrets.GITHUB_PUBLIC_READ_TOKEN }}
